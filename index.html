<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello, World — Powered by AI</title>
<style>
  :root {
    --bg: #06070d;
    --accent: #7c5cff;
    --accent2: #00e0d3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .stage {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 760px;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.4em;
    font-size: 0.72rem;
    color: var(--accent2);
    margin-bottom: 1.4rem;
    opacity: 0;
    animation: fade 1s ease forwards 0.2s;
  }
  h1 {
    font-size: clamp(2.6rem, 8vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    background: linear-gradient(110deg, #fff 10%, var(--accent) 45%, var(--accent2) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    min-height: 1.1em;
  }
  .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: var(--accent2);
    margin-left: 4px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
  }
  .subtitle {
    margin-top: 1.6rem;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    color: #aab;
    opacity: 0;
    animation: fade 1s ease forwards 2.6s;
  }
  .controls {
    margin-top: 2.6rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: fade 1s ease forwards 3s;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: rgba(124, 92, 255, 0.15);
    border: 1px solid rgba(124, 92, 255, 0.5);
    padding: 0.8rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover {
    transform: translateY(-2px);
    background: rgba(124, 92, 255, 0.32);
    box-shadow: 0 8px 30px rgba(124, 92, 255, 0.35);
  }
  button:active { transform: translateY(0); }
  .greeting-note {
    margin-top: 1.4rem;
    height: 1.4em;
    font-size: 1.05rem;
    color: var(--accent2);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .greeting-note.show { opacity: 1; }
  footer {
    position: fixed;
    bottom: 1.2rem;
    width: 100%;
    text-align: center;
    font-size: 0.78rem;
    color: #556;
    z-index: 1;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <main class="stage">
    <div class="eyebrow">Built by AI in seconds</div>
    <h1><span id="typed"></span><span class="cursor"></span></h1>
    <p class="subtitle">A tiny app — but the entire thing was designed, written, and styled by an AI assistant.</p>

    <div class="controls">
      <button id="langBtn">🌍 Say hello in another language</button>
      <button id="boomBtn">✨ Surprise me</button>
    </div>
    <div class="greeting-note" id="note"></div>
  </main>

  <footer>Open this file in any browser • No installs • 100% generated by AI</footer>

<script>
/* ---------- Typewriter headline ---------- */
const phrases = ["Hello, World.", "Hello, friends.", "The future is here."];
const typed = document.getElementById("typed");
let p = 0, c = 0, deleting = false;

function type() {
  const word = phrases[p];
  typed.textContent = deleting ? word.slice(0, c--) : word.slice(0, c++);
  let delay = deleting ? 45 : 90;
  if (!deleting && c === word.length + 1) { deleting = true; delay = 1600; }
  else if (deleting && c === 0) { deleting = false; p = (p + 1) % phrases.length; delay = 400; }
  setTimeout(type, delay);
}
type();

/* ---------- Multilingual hello ---------- */
const hellos = [
  ["Spanish", "¡Hola, mundo!"], ["French", "Bonjour le monde!"],
  ["Japanese", "こんにちは世界！"], ["Hindi", "नमस्ते दुनिया!"],
  ["Arabic", "مرحبا بالعالم!"], ["German", "Hallo Welt!"],
  ["Swahili", "Salamu, dunia!"], ["Korean", "안녕하세요 세계!"],
  ["Italian", "Ciao, mondo!"], ["Portuguese", "Olá, mundo!"]
];
const note = document.getElementById("note");
let hi = 0;
document.getElementById("langBtn").addEventListener("click", () => {
  const [lang, text] = hellos[hi % hellos.length];
  hi++;
  note.textContent = `${text}  (${lang})`;
  note.classList.add("show");
});

/* ---------- Confetti burst ---------- */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let W, H, stars = [], confetti = [];
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener("resize", resize);

for (let i = 0; i < 140; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.2, s: Math.random() * 0.4 + 0.05 });
}

const colors = ["#7c5cff", "#00e0d3", "#ff6ad5", "#ffd86a", "#6affb0"];
document.getElementById("boomBtn").addEventListener("click", () => {
  for (let i = 0; i < 160; i++) {
    confetti.push({
      x: W / 2, y: H / 2,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.5) * 16 - 4,
      g: 0.25, life: 1,
      color: colors[(Math.random() * colors.length) | 0],
      size: Math.random() * 6 + 3
    });
  }
});

function loop() {
  ctx.clearRect(0, 0, W, H);

  // drifting starfield
  ctx.fillStyle = "#fff";
  for (const st of stars) {
    st.y += st.s;
    if (st.y > H) st.y = 0;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // confetti
  confetti = confetti.filter(c => c.life > 0);
  for (const c of confetti) {
    c.vy += c.g;
    c.x += c.vx; c.y += c.vy;
    c.life -= 0.012;
    ctx.globalAlpha = Math.max(c.life, 0);
    ctx.fillStyle = c.color;
    ctx.fillRect(c.x, c.y, c.size, c.size);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
